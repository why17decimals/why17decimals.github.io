<h1>Privacy Policy</h1>
<p>The ZCode Sheets connector acts only on the Google account that authorized it. It stores OAuth tokens locally on the owner's computer and sends no data to any third party.</p>
<p>Access can be revoked at any time from Google Account permissions.</p>
